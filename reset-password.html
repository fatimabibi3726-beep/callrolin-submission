<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Callrolin</title>
  <link rel="icon" type="image/webp" href="callrolin-mark.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="config.js" defer></script>
  <script src="reset-password.js" defer></script>
</head>
<body>
  <div class="auth-page">
    <a class="brand" href="/">
      <img class="brand-mark" src="callrolin-mark.webp" alt="" width="40" height="40">
      <span class="brand-name"><span class="brand-call">Call</span><span class="brand-rolin">Rolin</span></span>
    </a>

    <div class="auth-card">
      <h1>Set a new password</h1>
      <p class="auth-subtitle">Choose a new password for your account</p>

      <form id="reset-form" class="auth-form is-visible">
        <label for="new-password">New Password</label>
        <div class="password-field">
          <input id="new-password" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
          <button type="button" class="toggle-password" data-target="new-password" aria-label="Show password">👁</button>
        </div>

        <label for="confirm-password">Confirm New Password</label>
        <input id="confirm-password" type="password" required minlength="6" autocomplete="new-password" placeholder="Repeat new password">

        <button type="submit" class="btn-auth">Update Password</button>
        <p class="auth-status" id="reset-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".toggle-password").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = document.getElementById(btn.getAttribute("data-target"));
          if (!input) return;
          const isHidden = input.type === "password";
          input.type = isHidden ? "text" : "password";
          btn.textContent = isHidden ? "🙈" : "👁";
        });
      });
    });
  </script>
</body>
</html>
