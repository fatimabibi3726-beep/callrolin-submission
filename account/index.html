<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Sign Up — Callrolin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="auth-page">
    <a class="brand" href="#" aria-label="Callrolin">
      <img class="brand-mark" src="callrolin-mark.webp" alt="" width="36" height="36">
      <span class="brand-name"><span class="brand-call">Call</span><span class="brand-rolin">Rolin</span></span>
    </a>

    <div class="auth-card">
      <div class="auth-tabs" role="tablist" aria-label="Sign in or sign up">
        <button class="auth-tab is-active" id="tab-login" role="tab" aria-selected="true" aria-controls="panel-login">Log In</button>
        <button class="auth-tab" id="tab-signup" role="tab" aria-selected="false" aria-controls="panel-signup">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="panel-login" class="auth-form" role="tabpanel" aria-labelledby="tab-login">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" required autocomplete="email">

        <label for="login-password">Password</label>
        <input id="login-password" type="password" required autocomplete="current-password">

        <button type="submit" class="btn-auth">Log In</button>
        <p class="auth-status" id="login-status" role="status" aria-live="polite"></p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="panel-signup" class="auth-form" role="tabpanel" aria-labelledby="tab-signup" hidden>
        <label for="signup-name">Full Name</label>
        <input id="signup-name" type="text" required autocomplete="name">

        <label for="signup-email">Email</label>
        <input id="signup-email" type="email" required autocomplete="email">

        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" required minlength="6" autocomplete="new-password">

        <button type="submit" class="btn-auth">Create Account</button>
        <p class="auth-status" id="signup-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</body>
</html>
