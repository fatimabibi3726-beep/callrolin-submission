<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Callrolin — Sign In / Sign Up</title>
  <link rel="icon" type="image/webp" href="grievance-logging/callrolin-mark.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#auth-main">Skip to sign in</a>

  <div class="auth-page">
    <a class="brand" href="/" aria-label="Callrolin home">
      <img class="brand-mark" src="callrolin-mark.webp" alt="" width="40" height="40">
      <span class="brand-name"><span class="brand-call">Call</span><span class="brand-rolin">Rolin</span></span>
    </a>

    <main class="auth-layout" id="auth-main">
      <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title">Welcome back</h1>
      <p class="auth-subtitle" id="auth-subtitle">Log in to your Callrolin account</p>

      <div class="auth-tabs" role="tablist" aria-label="Sign in or sign up">
        <button type="button" class="auth-tab is-active" id="tab-login" role="tab" aria-selected="true" aria-controls="panel-login">Log In</button>
        <button type="button" class="auth-tab" id="tab-signup" role="tab" aria-selected="false" aria-controls="panel-signup">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="panel-login" class="auth-form is-visible" role="tabpanel" aria-labelledby="tab-login">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" required autocomplete="email" placeholder="you@example.com">

        <label for="login-password">Password</label>
        <div class="password-field">
          <input id="login-password" type="password" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password"><span aria-hidden="true">View</span></button>
        </div>
        <a href="#" id="forgot-password-link" class="forgot-link">Forgot password?</a>

        <button type="submit" class="btn-auth">Log In</button>
        <p class="auth-status" id="login-status" role="status" aria-live="polite"></p>
      </form>

      <!-- FORGOT PASSWORD FORM -->
      <form id="panel-forgot" class="auth-form" role="tabpanel">
        <p class="auth-subtitle" style="margin-bottom: 1rem;">Enter your email and we'll send you a link to reset your password.</p>
        <label for="forgot-email">Email</label>
        <input id="forgot-email" type="email" required autocomplete="email" placeholder="you@example.com">

        <button type="submit" class="btn-auth">Send Reset Link</button>
        <a href="#" id="back-to-login-link" class="forgot-link">Back to Log In</a>
        <p class="auth-status" id="forgot-status" role="status" aria-live="polite"></p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="panel-signup" class="auth-form" role="tabpanel" aria-labelledby="tab-signup">
        <label for="signup-name">Full Name</label>
        <input id="signup-name" type="text" required autocomplete="name" placeholder="Your name">

        <label for="signup-email">Email</label>
        <input id="signup-email" type="email" required autocomplete="email" placeholder="you@example.com">

        <label for="signup-password">Password</label>
        <div class="password-field">
          <input id="signup-password" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
          <button type="button" class="toggle-password" data-target="signup-password" aria-label="Show password"><span aria-hidden="true">View</span></button>
        </div>

        <button type="submit" class="btn-auth">Create Account</button>
        <p class="auth-status" id="signup-status" role="status" aria-live="polite"></p>
      </form>
      </section>
    </main>
  </div>
</body>
</html>
