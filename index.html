<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Callrolin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      font-family: "Inter", sans-serif;
      color: #F5F1ED;
      background:
        radial-gradient(ellipse 70% 55% at 18% 15%, rgba(255,106,26,0.30) 0%, transparent 60%),
        radial-gradient(ellipse 65% 55% at 85% 20%, rgba(255,106,26,0.16) 0%, transparent 60%),
        radial-gradient(ellipse 70% 60% at 50% 100%, rgba(120,20,10,0.35) 0%, transparent 65%),
        #000000;
      text-align: center;
      padding: 2rem 1rem;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 900;
      font-size: 2rem;
    }
    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
    }
    .brand-call { color: #FF6A1A; }
    .brand-rolin { color: #ffffff; }
    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
    }
    .links a {
      display: block;
      padding: 1rem 1.25rem;
      border-radius: 14px;
      background: rgba(22,22,22,0.75);
      border: 1px solid #2A2A2A;
      color: #F5F1ED;
      text-decoration: none;
      font-weight: 700;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .links a:hover {
      border-color: #FF6A1A;
      transform: translateY(-2px);
    }
    .links span.sub {
      display: block;
      font-weight: 400;
      font-size: 0.8rem;
      color: #A9A099;
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>
  <a class="brand" href="#">
    <img src="grievance-logging/callrolin-mark.webp" alt="">
    <span><span class="brand-call">Call</span><span class="brand-rolin">Rolin</span></span>
  </a>

  <div class="links">
    <a href="/grievance-logging/">Grievance Logging<span class="sub">Voice-driven ticket logging</span></a>
    <a href="/helpcenter/">Voice Helpcenter<span class="sub">RAG-powered FAQ &amp; support</span></a>
    <a href="/account/">Sign Up / Log In<span class="sub">Account &amp; admin dashboard</span></a>
  </div>
</body>
</html>
